plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.duhapp.dnotes'
    compileSdk 35
    defaultConfig {
        applicationId "com.duhapp.dnotes"
        minSdk 24
        targetSdk 35
        versionCode 32
        versionName "3.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
        ]
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        // Compose compiler 1.5.8 is compatible with Kotlin 1.9.22
        kotlinCompilerExtensionVersion '1.5.8'
    }
    lintOptions {
        disable 'ParcelCreator' // Disable this lint check
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Navigation components (Compose-only migration)
    def nav_version = "2.8.0"
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // Hilt for Dependency Injection
    def hiltVersion = '2.51'
    implementation "com.google.dagger:hilt-android:$hiltVersion"
    kapt "com.google.dagger:hilt-compiler:$hiltVersion"

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-paging:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // ── Jetpack Compose ──────────────────────────────────────────────────────
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'

    // Compose Navigation + Hilt integration
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Kotlin Serialization (type-safe Compose Navigation routes)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Compose DataStore (for preferences — Sprint 6)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Compose debug tools
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    // ─────────────────────────────────────────────────────────────────────────

    // Emoji support
    implementation "com.vanniktech:emoji-google:0.16.0"

    // LeakCanary for memory leak detection in debug builds
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.11'

    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
}

tasks.register("printVersionName") {
    doLast {
        println android.defaultConfig.versionName
    }
}